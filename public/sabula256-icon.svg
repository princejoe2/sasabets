<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="40%" stop-color="#061610"/>
      <stop offset="100%" stop-color="#040c06"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#003322"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#005533"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <ellipse cx="256" cy="180" rx="200" ry="140" fill="rgba(245,197,24,0.05)"/>
  <ellipse cx="256" cy="380" rx="180" ry="100" fill="rgba(0,255,136,0.04)"/>

  <!-- SABULA text -->
  <text x="256" y="170"
    text-anchor="middle"
    font-family="'Arial Black',Impact,'Arial Bold',Arial,sans-serif"
    font-size="118"
    font-weight="900"
    fill="white"
    letter-spacing="10"
    filter="url(#glow)"
    opacity="0.95">SABULA</text>

  <!-- Chart bars -->
  <rect x="112" y="258" width="56" height="90" rx="8" fill="url(#bar1)"/>
  <rect x="200" y="218" width="56" height="130" rx="8" fill="url(#bar2)"/>
  <rect x="288" y="178" width="56" height="170" rx="8" fill="url(#bar3)"/>

  <!-- Trend line -->
  <polyline
    points="140,258 228,218 316,178 368,148"
    stroke="#f5c518"
    stroke-width="7"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.95"/>

  <!-- Trend dot -->
  <circle cx="368" cy="148" r="14" fill="#f5c518" filter="url(#dotglow)"/>

  <!-- 256 pill -->
  <rect x="156" y="364" width="200" height="82" rx="24" fill="url(#pill)"/>
  <!-- Pill highlight -->
  <rect x="156" y="364" width="200" height="38" rx="24" fill="rgba(255,255,255,0.14)"/>
  <text x="256" y="424"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="54"
    font-weight="900"
    fill="#040c06"
    letter-spacing="6">256</text>
</svg>
